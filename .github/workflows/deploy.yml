name: CI-CD to IIS (tallysiaenergy)

on:
  push:
    branches: [ "masterbranch" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ./EcommerceTelysia.csproj

      - name: Build (warnings ≠ errors)
        run: dotnet build ./EcommerceTelysia.csproj -c Release --no-restore /p:TreatWarningsAsErrors=false

      - name: Publish (warnings ≠ errors)
        run: dotnet publish ./EcommerceTelysia.csproj -c Release -o ./publish /p:TreatWarningsAsErrors=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  deploy:
    needs: build
    runs-on: self-hosted      # <- tumhara EC2 runner
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: C:\deploy\publish

      - name: Stop site (app_offline + stop pool)
        shell: powershell
        run: |
          $site = "C:\inetpub\wwwroot\tallysiaenergy"
          New-Item "$site\app_offline.htm" -ItemType File -Force | Out-Null
          & $env:windir\system32\inetsrv\appcmd stop apppool /apppool.name:"tallysiaenergy" | Out-Null

      - name: Backup current
        shell: powershell
        run: |
          $src = "C:\inetpub\wwwroot\tallysiaenergy"
          $dst = "C:\deploy\backups\$(Get-Date -f yyyyMMdd_HHmmss)"
          robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP | Out-Null

      - name: Deploy to inetpub
        shell: powershell
        run: |
          robocopy "C:\deploy\publish" "C:\inetpub\wwwroot\tallysiaenergy" /MIR /NFL /NDL /NJH /NJS /NP | Out-Null

      - name: Start site & warm-up
        shell: powershell
        run: |
          & $env:windir\system32\inetsrv\appcmd start apppool /apppool.name:"tallysiaenergy" | Out-Null
          Remove-Item "C:\inetpub\wwwroot\tallysiaenergy\app_offline.htm" -Force
          try { Invoke-WebRequest "http://localhost/" -UseBasicParsing -TimeoutSec 15 | Out-Null } catch {}
