name: Build and Deploy Tallysia

on:
  push:
    branches:
      - masterbranch
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Print SDK info
        run: dotnet --info

      # 👉 सिर्फ WEB PROJECT restore/build/publish
      - name: Restore (web project only)
        run: dotnet restore ./EcommerceTelysia.csproj

      - name: Build project (warnings ≠ errors)
        run: dotnet build ./EcommerceTelysia.csproj --configuration Release --no-restore -warnaserror-

      - name: Publish project
        run: dotnet publish ./EcommerceTelysia.csproj --configuration Release --no-build --output ./publish -warnaserror-

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: C:\deploy\publish

      - name: Stop site (app_offline + stop pool)
        shell: powershell
        run: |
          $site = "C:\inetpub\wwwroot\tallysiaenergy"
          if (!(Test-Path $site)) { New-Item -ItemType Directory -Path $site | Out-Null }
          New-Item "$site\app_offline.htm" -ItemType File -Force | Out-Null
          & $env:windir\system32\inetsrv\appcmd stop apppool /apppool.name:"tallysiaenergy" | Out-Null

      - name: Backup current
        shell: powershell
        run: |
          $src = "C:\inetpub\wwwroot\tallysiaenergy"
          $dst = "C:\deploy\backups\$(Get-Date -f yyyyMMdd_HHmmss)"
          if (!(Test-Path $dst)) { New-Item -ItemType Directory -Path $dst | Out-Null }
          robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP
          $code = $LASTEXITCODE
          if ($code -gt 3) { throw "Backup robocopy failed with exit code $code" }

      - name: Deploy to inetpub
        shell: powershell
        run: |
          $src = "C:\deploy\publish"
          $dst = "C:\inetpub\wwwroot\tallysiaenergy"
          robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP
          $code = $LASTEXITCODE
          if ($code -gt 3) { throw "Deploy robocopy failed with exit code $code" }

      - name: Start site & warm-up
        shell: powershell
        run: |
          & $env:windir\system32\inetsrv\appcmd start apppool /apppool.name:"tallysiaenergy" | Out-Null
          Remove-Item "C:\inetpub\wwwroot\tallysiaenergy\app_offline.htm" -Force -ErrorAction SilentlyContinue
          try { Invoke-WebRequest "http://localhost/" -UseBasicParsing -TimeoutSec 15 | Out-Null } catch {}
