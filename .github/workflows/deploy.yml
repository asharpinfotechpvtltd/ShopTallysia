name: Build and Deploy Tallysia

on:
  push:
    branches:
      - masterbranch
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore (web project only)
        run: dotnet restore ./EcommerceTelysia.csproj

      - name: Build (warnings ≠ errors)
        run: dotnet build ./EcommerceTelysia.csproj -c Release --no-restore -p:TreatWarningsAsErrors=false

      - name: Publish
        run: dotnet publish ./EcommerceTelysia.csproj -c Release --no-build -o ./publish -p:TreatWarningsAsErrors=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  deploy:
    needs: build
    runs-on: self-hosted   # EC2 runner
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: C:\deploy\publish

      - name: Stop site (app_offline + stop pool safely)
        shell: powershell
        run: |
          $sitePath = "C:\inetpub\wwwroot\tallysiaenergy"
          $pool     = "tallysiaenergy"   # IIS App Pool name

          if (!(Test-Path $sitePath)) { New-Item -ItemType Directory -Path $sitePath -Force | Out-Null }
          New-Item "$sitePath\app_offline.htm" -ItemType File -Force | Out-Null

          Import-Module WebAdministration
          Write-Host "Available app pools:"; (Get-ChildItem IIS:\AppPools | Select-Object name,state) | Format-Table -AutoSize
          if (Test-Path "IIS:\AppPools\$pool") {
            $state = (Get-WebAppPoolState -Name $pool).Value
            Write-Host "Current state of ${pool}: ${state}"
            if ($state -ne 'Stopped') { Stop-WebAppPool -Name $pool }
          } else {
            Write-Host "App pool '$pool' not found. Skipping stop."
          }

      - name: Backup current
        shell: powershell
        run: |
          $src  = "C:\inetpub\wwwroot\tallysiaenergy"
          $base = "C:\deploy\backups"
          if (!(Test-Path $base)) { New-Item -ItemType Directory -Path $base -Force | Out-Null }
          $dst  = Join-Path $base (Get-Date -f yyyyMMdd_HHmmss)

          if (!(Test-Path $dst)) { New-Item -ItemType Directory -Path $dst -Force | Out-Null }
          robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP
          $code = $LASTEXITCODE
          Write-Host "Robocopy (backup) exit code: $code"
          if ($code -gt 3) { throw "Backup robocopy failed with exit code $code" }
          $global:LASTEXITCODE = 0   # <- reset so step returns success

      - name: Deploy to inetpub
        shell: powershell
        run: |
          $src = "C:\deploy\publish"
          $dst = "C:\inetpub\wwwroot\tallysiaenergy"
          if (!(Test-Path $dst)) { New-Item -ItemType Directory -Path $dst -Force | Out-Null }
          robocopy $src $dst /MIR /NFL /NDL /NJH /NJS /NP
          $code = $LASTEXITCODE
          Write-Host "Robocopy (deploy) exit code: $code"
          if ($code -gt 3) { throw "Deploy robocopy failed with exit code $code" }
          $global:LASTEXITCODE = 0   # <- reset so step returns success

      - name: Start site & warm-up (safe)
        shell: powershell
        run: |
          $pool = "tallysiaenergy"
          Import-Module WebAdministration
          if (Test-Path "IIS:\AppPools\$pool") {
            Start-WebAppPool -Name $pool
          } else {
            Write-Host "App pool '$pool' not found. Skipping start."
          }
          Remove-Item "C:\inetpub\wwwroot\tallysiaenergy\app_offline.htm" -Force -ErrorAction SilentlyContinue
          try { Invoke-WebRequest "http://localhost/" -UseBasicParsing -TimeoutSec 15 | Out-Null } catch {}
